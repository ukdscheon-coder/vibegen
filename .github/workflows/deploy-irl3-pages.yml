name: Deploy IRL3 to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "irl3/**"
      - ".github/workflows/deploy-irl3-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload IRL3 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./irl3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
